<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Lanes game icon: three horizontal lanes with a stylised unit marker -->
  <rect width="128" height="128" rx="16" fill="#1a1a2e"/>
  <!-- Top lane -->
  <rect x="8" y="20" width="112" height="24" rx="6" fill="#16213e" stroke="#4a90d9" stroke-width="2"/>
  <!-- Middle lane (active) -->
  <rect x="8" y="52" width="112" height="24" rx="6" fill="#16213e" stroke="#e94560" stroke-width="3"/>
  <!-- Bottom lane -->
  <rect x="8" y="84" width="112" height="24" rx="6" fill="#16213e" stroke="#4a90d9" stroke-width="2"/>
  <!-- Unit marker in middle lane -->
  <circle cx="40" cy="64" r="9" fill="#e94560"/>
  <!-- Sword icon -->
  <line x1="72" y1="56" x2="96" y2="72" stroke="#f5a623" stroke-width="4" stroke-linecap="round"/>
  <circle cx="68" cy="53" r="4" fill="#f5a623"/>
</svg>
